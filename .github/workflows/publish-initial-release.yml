name: Publish initial release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    # One-time guard: this runs only for the commit that intentionally creates v0.1.0.
    if: github.event.head_commit.message == 'release: publish FixAtlas v0.1.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and verification tools
        run: python -m pip install -e ".[dev]"
      - name: Run automated tests
        run: python -m pytest
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Validate bundled diagnostic rules
        run: fixatlas validate-registry src/fixatlas/data/rules.json
      - name: Build wheel and source distribution
        run: python -m build
      - name: Create v0.1.0 tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            --target "$GITHUB_SHA" \
            --title "FixAtlas v0.1.0" \
            --generate-notes \
            dist/*
