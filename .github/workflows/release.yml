name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check GitHub bootstrap script syntax
        run: bash -n scripts/bootstrap_github.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and verification tools
        run: python -m pip install -e ".[dev]"
      - name: Run automated tests
        run: python -m pytest
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Validate bundled rule database
        run: fixatlas validate-registry src/fixatlas/data/rules.json
      - name: Build source and wheel distributions
        run: python -m build
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
