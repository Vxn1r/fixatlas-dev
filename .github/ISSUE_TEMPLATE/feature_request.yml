name: Feature request
description: Propose an improvement to FixAtlas
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What developer problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Compatibility and privacy
      options:
        - label: This proposal does not require uploading private logs by default.
          required: true
        - label: This proposal does not silently execute shell commands or modify the user's environment.
          required: true
